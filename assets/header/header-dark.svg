<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Nika Tolordava. Linux, infrastructure and SRE. A heartbeat trace that keeps running.">
  <style>
    .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .pulse{stroke-dasharray:260 3000;animation:sweep 5s linear infinite}
    @keyframes sweep{from{stroke-dashoffset:260}to{stroke-dashoffset:-3000}}
    .blink{animation:blink 1.2s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse,.blink{animation:none}}
  </style>
